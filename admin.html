<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tavelya Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f9;--sf:#fff;--ink:#0f172a;--mut:#64748b;--ln:#e2e8f0;--ac:#4f46e5;--ok:#16a34a;--bad:#dc2626;--sb:#0f172a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1120;--sf:#131c31;--ink:#e8edf7;--mut:#94a3b8;--ln:#26334d;--sb:#070b16;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1120;--sf:#131c31;--ink:#e8edf7;--mut:#94a3b8;--ln:#26334d;--sb:#070b16;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14.5px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--sb);color:#cbd5e1;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:3px}
.lg{padding:4px 8px 12px;line-height:0}.lg img{height:22px;width:auto}
.tp{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--ln)}.nm{font-size:22px;font-weight:800;color:var(--ac);letter-spacing:-.02em}.tp span:last-child{color:var(--mut)}
aside small{color:#64748b;margin:14px 10px 4px;font-size:12px;font-weight:700}
aside button{display:flex;justify-content:space-between;align-items:center;background:none;border:0;color:inherit;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:700}
aside button:hover{background:rgba(255,255,255,.08)}aside button.on{background:var(--ac);color:#fff}
.bd{background:#f59e0b;color:#1a1000;border-radius:99px;padding:0 8px;font-size:12px}
main{padding:26px;min-width:0;max-width:1100px}
h1{margin:0 0 4px;font-size:26px;letter-spacing:-.02em}h3{margin:0 0 10px}.sub{color:var(--mut);margin:0 0 18px;font-weight:500}.card .sub{margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;cursor:pointer;text-align:left;color:var(--mut)}.stat b{display:block;font-size:28px;color:var(--ink)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:10px}
.tbw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mut);font-weight:700;padding:8px;border-bottom:1px solid var(--ln);white-space:nowrap;font-size:13px}
td{padding:10px 8px;border-bottom:1px solid var(--ln);vertical-align:middle}
.btn{border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:13px}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.bad{color:var(--bad)}
.chip{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--ln);color:var(--ink)}
.chip.pending,.chip.awaiting_confirmation{background:#fef3c7;color:#92400e}.chip.paid{background:#dcfce7;color:#166534}.chip.cancelled,.chip.refunded{background:#fee2e2;color:#991b1b}.chip.approved,.chip.published{background:#dcfce7;color:#166534}.chip.rejected,.chip.hidden{background:#fee2e2;color:#991b1b}
label{display:block;font-weight:700;font-size:13px;margin-bottom:10px}
input,select,textarea{width:100%;margin-top:4px;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg)}
input[type=checkbox]{width:auto;margin:0 6px 0 0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 14px}
dialog{border:0;border-radius:16px;padding:20px;width:min(520px,94vw);max-height:90vh;background:var(--sf);color:var(--ink)}dialog::backdrop{background:rgba(0,0,0,.55)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:99px;display:none;z-index:99}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px}aside small,.lg{display:none}aside button{white-space:nowrap;gap:8px}main{padding:14px}}
</style>
</head>

let sb,snap={};
const sv=async k=>{try{
if(['products','depts','banners','set','pay','paymethods'].includes(k)){let val=DB[k];if(k==='products'){val=DB.products.map(({access,...p})=>p);for(const p of DB.products){if(p.access){const{error}=await sb.from('product_access').upsert({product_key:p.id,url:p.access});if(error)throw error}else await sb.from('product_access').delete().eq('product_key',p.id)}}const{error}=await sb.from('site_data').upsert({key:k,value:val,updated_at:new Date().toISOString()});if(error)throw error}
else if(k==='orders'){const S=snap.orders||{};for(const o of DB.orders){const x=S[o.id];if(x&&x.status!==o.status){const{error}=await sb.from('orders').update({status:o.status}).eq('id',o.id);if(error)throw error}}}
else if(k==='users'){const keep=new Set(DB.users.map(u=>u.id)),S=snap.users||{};for(const u of DB.users){const o=S[u.id];if(!o||o.status!==u.status||o.rate!==u.rate||o.type!==u.type||o.name!==u.name){const{error}=await sb.from('profiles').update({status:u.status,rate:u.rate||0,type:u.type,name:u.name}).eq('id',u.id);if(error)throw error}}for(const id in S)if(!keep.has(id)){const{error}=await sb.from('profiles').update({status:'rejected'}).eq('id',id);if(error)throw error}}
else if(k==='reviews'){const keep=new Set(DB.reviews.map(r=>r.id)),S=snap.reviews||{};for(const r of DB.reviews){const o=S[r.id];if(o&&o.status!==r.status){const{error}=await sb.from('reviews').update({status:r.status}).eq('id',r.id);if(error)throw error}}for(const id in S)if(!keep.has(id)){const{error}=await sb.from('reviews').delete().eq('id',id);if(error)throw error}}
else if(k==='msgs'){const keep=new Set(DB.msgs.map(m=>m.id)),S=snap.msgs||{};for(const m of DB.msgs)if(!S[m.id]){const u=DB.users.find(x=>x.name===m.to);const{error}=await sb.from('messages').insert({id:m.id,to_user:u?u.id:null,body:m.t});if(error)throw error}for(const id in S)if(!keep.has(id))await sb.from('messages').delete().eq('id',id)}
if(Array.isArray(DB[k]))snap[k]=Object.fromEntries(DB[k].map(x=>[x.id,{...x}]))}catch(e){toast('Save failed: '+(e.message||e))}};

const V={
ov(){const af=DB.users.filter(u=>u.type==='affiliate'&&u.status==='approved').length;return head('Dashboard','You control the store and the affiliate platform from here.')+`<div class="stats">${[['Waiting for approval',pend(),'users','pending'],['Active affiliates',af,'users','affiliate'],['Products',DB.products.length,'products'],['Departments',DB.depts.length,'depts'],['Live banners',DB.banners.filter(b=>b.on).length,'banners'],['Reviews',DB.reviews.length,'reviews']].map(s=>`<button class="stat" data-go="${s[2]}" data-uf="${s[3]||''}"><span>${s[0]}</span><b>${s[1]}</b></button>`).join('')}</div><div class="card"><h3>Waiting for your approval</h3>${DB.users.filter(u=>u.status==='pending').map(pr).join('')||'<p class="sub">Nothing waiting.</p>'}</div><p class="sub">Signups, reviews and orders will appear here once the backend is connected.</p>`},
users(){const L=DB.users.filter(u=>uf==='all'||(uf==='pending'?u.status==='pending':u.type===uf));return head('Accounts','Approve, reject, edit or remove customer and affiliate accounts.')+`<div class="card"><div class="bar"><span>${[['all','All'],['pending','Pending'],['customer','Customers'],['affiliate','Affiliates']].map(f=>`<button class="btn${uf===f[0]?' p':''}" data-uf="${f[0]}">${f[1]}</button>`).join(' ')}</span></div>${tbl('users',L,u=>(u.status!=='approved'?`<button class="btn ok" data-st="${u.id}:approved">Approve</button> `:'')+(u.status!=='rejected'?`<button class="btn bad" data-st="${u.id}:rejected">Reject</button> `:''))}</div>`},
products:gen('products','Products','Add, edit or remove anything in the store catalog.'),
depts:gen('depts','Departments','Departments appear in the store menu and search. Set the affiliate commission for each.'),
banners:gen('banners','Homepage banners','Promote your own products or other brands. Edit to change the image, video or link, and use the arrows to reorder.',r=>`<button class="btn" data-mv="${r.id}:-1">\u2191</button> <button class="btn" data-mv="${r.id}:1">\u2193</button> `),
reviews:gen('reviews','Reviews','Hide a review from the store or delete it. Affiliates can read published reviews.',r=>`<button class="btn" data-rst="${r.id}">${r.status==='hidden'?'Publish':'Hide'}</button> `),
orders(){const U=Object.fromEntries(DB.users.map(u=>[u.id,u])),st=s=>`<span class="chip ${s}">${s.replace('_',' ')}</span>`;return head('Orders','Confirm payments here. When you mark an order paid, the customer gets access in My library.')+`<div class="card"><div class="tbw"><table><thead><tr><th>Date</th><th>Customer</th><th>Product</th><th>Amount</th><th>Method</th><th>Reference</th><th>Status</th><th></th></tr></thead><tbody>${DB.orders.map(o=>{const u=U[o.user_id];return`<tr><td>${new Date(o.created_at).toLocaleDateString()}</td><td>${u?esc(u.name)+'<br><small>'+esc(u.email)+'</small>':'Customer'}</td><td>${esc(o.product_title)}</td><td>$${Number(o.amount).toFixed(2)}</td><td>${esc(o.method||'')}</td><td>${esc(o.reference||'')}${o.ref_code?'<br><small>ref '+esc(o.ref_code)+'</small>':''}</td><td>${st(o.status)}</td><td style="white-space:nowrap">${o.status==='paid'?`<button class="btn bad" data-os="${o.id}:refunded">Refund</button>`:o.status==='pending'||o.status==='awaiting_confirmation'?`<button class="btn ok" data-os="${o.id}:paid">Mark paid</button> <button class="btn bad" data-os="${o.id}:cancelled">Cancel</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="8">No orders yet.</td></tr>'}</tbody></table></div></div>`},
pay(){const p=DB.pay;return head('Payments','Choose how customers pay. They pay on your checkout page, and you confirm each payment before they get access.')+`<form id="payf" class="card"><h3>Online checkout</h3><p class="sub">Create a payment link in Stripe, Paystack, Flutterwave or PayPal, then paste it into each product (Products, Edit, Checkout link). The checkout button uses the label below.</p><label>Button label<input name="label" value="${esc(p.label)}"></label><label>Note shown on the checkout page (optional)<input name="note" value="${esc(p.note)}"></label><button class="btn p">Save</button></form><div class="card"><h3>Manual payment methods</h3><p class="sub">Bank transfer, mobile money, a PayPal address and similar. Customers see your instructions, pay, then enter their payment reference. These details are public, so add nothing private.</p><div class="bar"><span></span><button class="btn p" data-add="paymethods">Add method</button></div>${tbl('paymethods',DB.paymethods)}</div>`},
msgs(){const A=DB.users.filter(u=>u.type==='affiliate'&&u.status==='approved');return head('Messages','Send updates to your affiliates. They see them in their Messages tab.')+`<div class="card"><form id="mf"><label>To<select name="to"><option>All affiliates</option>${A.map(a=>`<option>${esc(a.name)}</option>`).join('')}</select></label><label>Message<textarea name="t" rows="4" required></textarea></label><button class="btn p">Send message</button></form></div><div class="card"><h3>Sent</h3>${DB.msgs.map(m=>`<div class="bar"><span><b>${esc(m.to)}</b> <span class="sub">${m.d}</span><br>${esc(m.t)}</span><button class="btn bad" data-del="msgs:${m.id}">Delete</button></div>`).join('')||'<p class="sub">Nothing sent yet.</p>'}</div>`},
set(){const s=DB.set,th=[['a','Navy & Orange'],['b','Green & Gold'],['c','White & Orange'],['d','Black & Orange']],op=c=>th.map(t=>`<option value="${t[0]}"${c===t[0]?' selected':''}>${t[1]}</option>`).join('');return head('Settings','Controls the whole store and the affiliate platform.')+`<form id="sf" class="card"><div class="g2"><label>Store name<input name="name" value="${esc(s.name)}"></label><label>Tagline<input name="tag" value="${esc(s.tag)}"></label></div><label>Announcement bar on the store (empty hides it)<input name="announce" value="${esc(s.announce)}"></label><div class="g2"><label>Store colors<select name="theme">${op(s.theme)}</select></label><label>Affiliate platform colors<select name="atheme">${op(s.atheme)}</select></label><label>Default language<select name="lang">${[['en','English'],['fr','Fran\u00e7ais'],['es','Espa\u00f1ol']].map(l=>`<option value="${l[0]}"${s.lang===l[0]?' selected':''}>${l[1]}</option>`).join('')}</select></label><label>Affiliate cookie (days)<input name="cookie" type="number" value="${s.cookie}"></label><label>Minimum payout ($)<input name="payout" type="number" value="${s.payout}"></label><label>Refund window before payout (days)<input name="refund" type="number" value="${s.refund}"></label></div><p class="sub">Store name, tagline, announcement, language, cookie days, minimum payout and refund window are saved now and will be applied to the store and affiliate pages as those features are built. Affiliates are always approved by you; customers are approved automatically.</p><button class="btn p">Save settings</button></form>`}};
const NAV=[['-','Overview'],['ov','Dashboard'],['users','Accounts'],['orders','Orders'],['-','Store'],['products','Products'],['depts','Departments'],['banners','Banners'],['reviews','Reviews'],['-','Affiliates'],['msgs','Messages'],['-','Site'],['pay','Payments'],['set','Settings']];
function draw(){$('#app').innerHTML=`<div class="app"><aside><div class="lg"><img src="${LG}" alt="Tavelya"></div>${NAV.map(n=>n[0]==='-'?`<small>${n[1]}</small>`:`<button data-nav="${n[0]}" class="${tab===n[0]?'on':''}">${n[1]}${n[0]==='users'&&pend()?`<span class="bd">${pend()}</span>`:''}${n[0]==='orders'&&awc()?`<span class="bd">${awc()}</span>`:''}</button>`).join('')}</aside><main><div class="tp"><span class="nm">${esc(DB.set.name)}</span><span>Admin panel</span><span>${esc(DB.set.tag)}</span><button class="btn" data-out="1" style="margin-left:auto">Sign out</button></div>${V[tab]()}</main></div>`}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
if(d.nav||d.go){tab=d.nav||d.go;if(d.uf)uf=d.uf;draw();scrollTo(0,0)}
else if(d.uf){uf=d.uf;draw()}
else if(d.add)openF(d.add)
else if(d.edit){const[k,id]=d.edit.split(':');openF(k,id)}
else if(d.del){if(!d.arm){d.arm=1;t.textContent='Sure?';setTimeout(()=>{t.textContent='Delete';delete t.dataset.arm},3000);return}const[k,id]=d.del.split(':');DB[k]=DB[k].filter(x=>x.id!==id);sv(k);draw();toast('Deleted')}
else if(d.st){const[id,s]=d.st.split(':');DB.users.find(u=>u.id===id).status=s;sv('users');draw();toast(s==='approved'?'Account approved':'Account rejected')}
else if(d.rst){const r=DB.reviews.find(x=>x.id===d.rst);r.status=r.status==='hidden'?'published':'hidden';sv('reviews');draw()}
else if(d.mv){const[id,n]=d.mv.split(':'),a=DB.banners,i=a.findIndex(x=>x.id===id),j=i+ +n;if(a[j]){[a[i],a[j]]=[a[j],a[i]];sv('banners');draw()}}
else if(d.os){const[id,s]=d.os.split(':');DB.orders.find(o=>o.id===id).status=s;sv('orders');draw();toast('Order updated')}
else if(d.out){sb.auth.signOut().then(()=>location.reload())}
else if(d.x)$('#md').close()});
document.addEventListener('submit',async ev=>{const f=ev.target;ev.preventDefault();const fd=new FormData(f);
if(f.dataset.k){const k=f.dataset.k,e=E[k],id=f.dataset.id,o={};
for(const[n,,t]of e.f){if(t==='file'){const file=fd.get(n);if(file&&file.size){const v=await rd(file,n);if(v)o[n]=v}}else if(t==='check')o[n]=fd.has(n);else if(t==='number')o[n]=parseFloat(fd.get(n))||0;else o[n]=String(fd.get(n)).trim()}
if(!o[e.f[0][0]])return toast('Please fill in the first field.');
if(id){const it=DB[k].find(x=>x.id===id);if(k==='depts'){DB.products.forEach(p=>{if(p.dept===it.name)p.dept=o.name});sv('products')}Object.assign(it,o)}else DB[k].push({id:uid(),...(e.def||{}),...o});
sv(k);$('#md').close();toast('Saved');draw()}
else if(f.id==='lf'){const{error}=await sb.auth.signInWithPassword({email:fd.get('e'),password:fd.get('p')});if(error)return gate(error.message);boot()}
else if(f.id==='payf'){DB.pay.label=String(fd.get('label')).trim();DB.pay.note=String(fd.get('note')).trim();sv('pay');toast('Saved')}
else if(f.id==='sf'){const s=DB.set;for(const k of['name','tag','announce','theme','atheme','lang'])s[k]=String(fd.get(k)).trim();for(const k of['cookie','payout','refund'])s[k]=+fd.get(k)||0;s.ac=fd.has('ac');s.af=fd.has('af');sv('set');toast('Settings saved')}
else if(f.id==='mf'){DB.msgs.unshift({id:uid(),to:fd.get('to'),t:String(fd.get('t')).trim(),d:new Date().toLocaleDateString()});sv('msgs');toast('Message sent');draw()}});
function gate(msg=''){$('#app').innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:20px"><form id="lf" class="card" style="width:min(380px,100%)"><div style="background:#0f172a;border-radius:10px;padding:10px 12px;margin-bottom:12px;line-height:0"><img src="${LG}" alt="Tavelya" style="height:24px;width:auto"></div><h2 style="margin:0 0 4px">Admin sign in</h2>${msg?`<p style="color:var(--bad);font-weight:700">${esc(msg)}</p>`:'<p class="sub">Authorized staff only.</p>'}<label>Email<input name="e" type="email" required autocomplete="email"></label><label>Password<input name="p" type="password" required autocomplete="current-password"></label><button class="btn p" style="width:100%">Sign in</button></form></div>`}
async function load(){const[sd,pf,rv,ms,od,pa]=await Promise.all([sb.from('site_data').select('key,value'),sb.from('profiles').select('*').order('created_at',{ascending:false}),sb.from('reviews').select('*').order('created_at',{ascending:false}),sb.from('messages').select('*').order('created_at',{ascending:false}),sb.from('orders').select('*').order('created_at',{ascending:false}),sb.from('product_access').select('*')]);
(sd.data||[]).forEach(r=>DB[r.key]=r.value);
DB.users=(pf.data||[]).filter(p=>p.type!=='admin').map(p=>({id:p.id,name:p.name||'(no name)',email:p.email||'',type:p.type,status:p.status,rate:Number(p.rate)||0}));
DB.reviews=(rv.data||[]).map(r=>({id:r.id,product:r.product||r.product_id,s:r.rating||0,t:r.body||'',status:r.status}));
DB.msgs=(ms.data||[]).map(m=>{const u=DB.users.find(x=>x.id===m.to_user);return{id:m.id,to:u?u.name:'All affiliates',t:m.body,d:new Date(m.created_at).toLocaleDateString()}});
DB.orders=od.data||[];(pa.data||[]).forEach(x=>{const p=DB.products.find(y=>y.id===x.product_key);if(p)p.access=x.url});
for(const k of['users','reviews','msgs','products','depts','banners','orders','paymethods'])snap[k]=Object.fromEntries(DB[k].map(x=>[x.id,{...x}]))}
async function boot(){if(!window.supabase||!window.TV_CONFIG)return gate('Could not load the database library. Check your internet connection.');sb=sb||supabase.createClient(TV_CONFIG.url,TV_CONFIG.key);const{data:{session}}=await sb.auth.getSession();if(!session)return gate();const{data:p}=await sb.from('profiles').select('type,status').eq('id',session.user.id).maybeSingle();if(!p||p.type!=='admin'||p.status!=='approved'){await sb.auth.signOut();return gate('This account does not have admin access.')}await load();draw()}
boot();
</script>
</body>
</html>
