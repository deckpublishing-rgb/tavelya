<head>

<style>
:root{--bg:#fbf7f0;--sf:#fff;--ink:#1f1a14;--mut:#7a6f62;--ln:#ece3d4;--brand:#0b1f4d;--h2:#1558d6;--ac:#ff8a00;--aci:#1a1000;box-sizing:border-box}
html[data-t="b"]{--brand:#0d3b2e;--h2:#1f7a5a;--ac:#f2b705;--aci:#241c00}
html[data-t="c"]{--brand:#d95f00;--h2:#ff9a2e;--ac:#0e1630;--aci:#fff}
html[data-t="d"]{--brand:#111;--h2:#3a3a3a;--ac:#ff8a00;--aci:#1a1000}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14110d;--sf:#1e1a14;--ink:#f3ede3;--mut:#a89c8b;--ln:#322b21;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14110d;--sf:#1e1a14;--ink:#f3ede3;--mut:#a89c8b;--ln:#322b21;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
h2{margin:0 0 4px;font-size:24px;letter-spacing:-.02em}h3{margin:0 0 10px}.sub{color:var(--mut);margin:0 0 14px}
label{display:block;font-weight:700;font-size:14px;margin-bottom:12px}
input,select{width:100%;margin-top:5px;padding:12px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);font-size:16px}
.cta{background:var(--ac);color:var(--aci);border:0;border-radius:99px;padding:12px 20px;font-weight:800;cursor:pointer;font-size:15px}.cta.w{width:100%}
.lk{background:none;border:0;padding:0;color:var(--h2);font-weight:700;cursor:pointer;text-decoration:underline}
.er{color:#dc2626;font-weight:700;margin:0 0 12px}
.au{min-height:min(100vh,620px);display:grid;grid-template-columns:1fr 1fr}
.au .l{background:linear-gradient(135deg,var(--brand) 30%,var(--h2));color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center}
.au .l h2{font-size:32px;margin:0 0 16px}.au .l ul{margin:0;padding-left:20px;display:grid;gap:8px;opacity:.95}
.au .r{display:grid;place-items:center;padding:28px 20px}.fc{width:min(400px,100%)}
@media(max-width:820px){.au{grid-template-columns:1fr}.au .l{padding:26px 20px}.au .l h2{font-size:24px}}
.top{background:var(--brand);color:#fff;position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:1180px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.top img{height:24px;width:auto;display:block}.tag{font-weight:800;opacity:.9}.sp{flex:1}
.me{display:flex;gap:10px;align-items:center;font-size:13px;line-height:1.2}.me small{display:block;opacity:.8}
.av{width:34px;height:34px;border-radius:50%;background:var(--ac);color:var(--aci);display:grid;place-items:center;font-weight:800;border:0;cursor:pointer}
.out{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:700}
.tabs{max-width:1180px;margin:auto;padding:0 10px;display:flex}
.tabs button{background:none;border:0;color:#fff;opacity:.75;padding:11px 16px;cursor:pointer;font-weight:700;border-bottom:3px solid transparent}
.tabs button.on{opacity:1;border-color:var(--ac)}
.bnav{display:none}
main{max-width:1180px;margin:auto;padding:20px 16px 40px}
.hero{background:linear-gradient(115deg,var(--brand) 25%,var(--h2));color:#fff;border-radius:18px;padding:22px;margin-bottom:16px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.hero h2{font-size:28px}.hero small{opacity:.85;font-weight:700}.hero p{margin:4px 0 0;opacity:.92}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px}.stat span{color:var(--mut);font-size:13px;font-weight:700}.stat b{display:block;font-size:26px;letter-spacing:-.02em}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:16px}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
.chart{display:flex;align-items:flex-end;gap:6px;height:160px}.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut)}
.chart i{display:block;width:100%;background:linear-gradient(var(--h2),var(--brand));border-radius:6px 6px 0 0;min-height:3px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}.row:first-of-type{border-top:0}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chip{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:8px 16px;cursor:pointer;font-weight:700;white-space:nowrap}.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pc{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.cv{height:86px;border-radius:10px;color:#fff;font-weight:800;padding:10px;display:flex;align-items:flex-end;background:linear-gradient(150deg,hsl(var(--h) 65% 30%),hsl(calc(var(--h) + 40) 70% 48%))}
.earn{color:var(--mut);font-size:13px}.earn b{color:var(--ink)}
.bt{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.b{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:13px}.b.p{background:var(--ac);color:var(--aci);border-color:var(--ac)}
.rv{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px}
.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:800;background:#fef3c7;color:#92400e}
.mid{min-height:100vh;display:grid;place-items:center;padding:20px}.mid .card{width:min(460px,100%)}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:99px;display:none;z-index:99;max-width:92vw;text-align:center}
footer{max-width:1180px;margin:auto;padding:0 16px 30px;color:var(--mut);font-size:13px}footer select{width:auto;margin:0;padding:4px 8px;font-size:13px}
@media(max-width:820px){
.tabs,.out{display:none}.two{grid-template-columns:1fr}main{padding:14px 14px 96px}.hero{padding:18px}.hero h2{font-size:23px}.hero .cta{width:100%}
.stat b{font-size:22px}.me small{display:none}
.bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.bnav button{background:none;border:0;padding:12px 2px;font-size:12px;font-weight:700;color:var(--mut);cursor:pointer;border-top:3px solid transparent}
.bnav button.on{color:var(--ink);border-color:var(--ac)}
.pg{grid-template-columns:1fr}.b{padding:11px 16px}}
.ld{padding:44px 18px}.ld.alt{background:var(--sf);border-block:1px solid var(--ln)}.ldi{max-width:960px;margin:auto}.ldi>h2{text-align:center;margin-bottom:22px;font-size:26px}
.st3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.st3>div{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px}.st3 b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ac);color:var(--aci)}.st3 h3{margin:10px 0 4px}.st3 p{margin:0;color:var(--mut)}
.ck{display:grid;gap:8px;padding-left:20px;margin:6px 0 0}
details{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px 16px;margin-bottom:10px}summary{cursor:pointer;font-weight:700}details p{margin:8px 0 0;color:var(--mut)}
.lf{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;padding:24px 18px 36px;max-width:none}.lf a{color:var(--mut)}
html:not([data-demo="true"]) footer:not(.lf){display:none}
</style>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const hash=async s=>{try{return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(s)}};
const DEMO_MODE=false; // set true to enable the demo account and self-approval for testing
document.documentElement.dataset.demo=DEMO_MODE;
const DEMO='demo@tavelya.com',AVG=18,DAY=[2,0,3,5,1,4,6,2,3,7,4,5,8,6],ZERO=Array(14).fill(0);

let P=[];
let RV={};
let MSG=[];
const money=v=>'$'+v.toFixed(2),earn=(p,n)=>n*p[3]*COM[p[2]]/100;
let U=null,mode='in',err='',tab='dash',dp='All',q='',op='',sb;
const isD=()=>false,day=()=>isD()?DAY:ZERO,S=()=>day().reduce((a,b)=>a+b,0),cl=()=>isD()?1240:0;
const LB=()=>[['You',S()]];
const V={
dash(){const lb=LB(),rank=lb.findIndex(x=>x[0]==='You')+1,s=S(),sold=isD()?P.slice().sort((a,b)=>b[5]-a[5]).slice(0,3):[];
return`<div class="hero"><div><small>Welcome</small><h2>${esc(U.name)}</h2><p>Your dashboard fills in as sales come through your links.</p></div><button class="cta" data-nav="market">Find products to promote</button></div>
<div class="grid"><div class="stat"><span>Clicks</span><b>${cl().toLocaleString()}</b></div><div class="stat"><span>Sales</span><b>${s}</b></div><div class="stat"><span>Conversion</span><b>${cl()?(s/cl()*100).toFixed(1):'0.0'}%</b></div><div class="stat"><span>Earnings</span><b>${money(s*AVG*.3)}</b></div></div>
<div class="two"><div><div class="card"><h3>Sales per day</h3><div class="chart">${day().map((v,i)=>`<div title="${v} sales"><i style="height:${v/8*100}%"></i>${i+1}</div>`).join('')}</div><p class="sub" style="margin:8px 0 0">Last 14 days${isD()?'. Sample data for the demo account.':'.'}</p></div>
<div class="card"><h3>Your top links</h3>${sold.map(p=>`<div class="row"><span><b>${esc(p[1])}</b><br><span class="earn">${p[5]} sales</span></span><b>${money(earn(p,p[5]))}</b></div>`).join('')||'<p class="sub">No sales yet. Open the Marketplace, copy a link and start sharing.</p>'}</div></div>
</div>`},
market(){const L=P.filter(p=>(dp==='All'||p[2]===dp)&&p[1].toLowerCase().includes(q.toLowerCase())),sh=!!navigator.share;
return`<h2>Marketplace</h2><p class="sub">Every product on the store. Pick one, copy your unique link and start promoting.</p><div class="chips">${['All',...Object.keys(COM)].map(d=>`<button class="chip${dp===d?' on':''}" data-dp="${d}">${d}</button>`).join('')}</div><label><input type="search" id="qs" placeholder="Search products" value="${esc(q)}" aria-label="Search products"></label><div class="pg">${L.map(p=>{const r=RV[p[1]]||[];return`<div class="pc"><div class="cv" style="--h:${p[4]}">${esc(p[2])}</div><b>${esc(p[1])}</b><span class="earn">${money(p[3])} \u00b7 earn <b>${COM[p[2]]}%</b> (${money(p[3]*COM[p[2]]/100)} per sale)</span><div class="bt"><button class="b p" data-cp="${p[0]}">Copy link</button>${sh?`<button class="b" data-sh="${p[0]}">Share</button>`:''}<button class="b" data-rv="${p[0]}">Reviews (${r.length})</button></div>${op===p[0]?r.map(x=>`<div class="rv"><b>${'\u2605'.repeat(x[0])}</b> ${esc(x[1])}</div>`).join('')||'<div class="rv">No reviews yet.</div>':''}</div>`}).join('')||'<p>No products found.</p>'}</div>`},

me(){return`<h2>Profile</h2><p class="sub">Your details and how you get paid.</p><form class="card" id="pf"><label>Full name<input name="name" value="${esc(U.name)}" required autocomplete="name"></label><label>Email<input value="${esc(U.email)}" disabled></label><label>Payout method<select name="pay">${['Bank transfer','PayPal','Mobile money'].map(x=>`<option${U.pay===x?' selected':''}>${x}</option>`).join('')}</select></label><label>Payout details (account number, PayPal email or phone)<input name="det" value="${esc(U.det||'')}"></label><button class="cta">Save profile</button></form><div class="card"><h3>Your affiliate code</h3><p><b>${U.code}</b></p><button class="b" data-out="1">Sign out</button></div>`}};
const TABS=[['dash','Home'],['market','Market'],['pay','Payouts'],['msg','Inbox'],['me','Profile']];
const authTop=()=>`<div class="au"><div class="l"><img src="${LG}" alt="Tavelya" style="height:30px;width:auto;align-self:flex-start;margin-bottom:26px"><h2>Earn by sharing what you love</h2><ul><li>30% commission on ebooks, audiobooks and courses</li><li>A unique link for every product</li><li>A live sales dashboard and regular payouts</li></ul></div><div class="r"><form class="fc" id="af"><h2>${mode==='in'?'Sign in':'Apply to join'}</h2><p class="sub">${mode==='in'?'Welcome back.':'New accounts are reviewed and approved by the Tavelya team.'}</p>${mode==='up'?'<label>Full name<input name="name" required autocomplete="name"></label>':''}<label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="pw" type="password" required minlength="8" autocomplete="${mode==='in'?'current-password':'new-password'}"></label>${err?`<p class="er" role="alert">${err}</p>`:''}<button class="cta w">${mode==='in'?'Sign in':'Submit application'}</button><p class="sub" style="margin-top:14px">${mode==='in'?'New here? <button type="button" class="lk" data-m="up">Apply to join</button> \u00b7 <button type="button" class="lk" data-fp="1">Forgot password?</button>':'Already approved? <button type="button" class="lk" data-m="in">Sign in</button>'}</p>${DEMO_MODE&&mode==='in'?`<p class="sub">Demo account: ${DEMO} / demo1234</p>`:''}</form></div></div>`;
const FAQ=[['Who can join?','Anyone can apply. We approve affiliates whose audience fits our products.'],['Does it cost anything?','No. Joining is free.'],['How long does a link track?','30 days from the click.'],['When do I get paid?','Once your balance reaches $50 and the 14-day refund window has passed.'],['What is not allowed?','Spam, fake reviews, misleading claims, and buying through your own link. See the Affiliate Agreement.'],['Do I need to say I earn commission?','Yes. Always make clear that you may earn a commission when people buy through your link.']];
const landing=()=>`<section class="ld"><div class="ldi"><h2>How it works</h2><div class="st3"><div><b>1</b><h3>Apply</h3><p>Create your account. Our team reviews every application.</p></div><div><b>2</b><h3>Share</h3><p>Copy your unique link for any ebook, audiobook, course or gadget.</p></div><div><b>3</b><h3>Earn</h3><p>Get commission on every sale that comes through your link.</p></div></div></div></section><section class="ld alt"><div class="ldi"><h2>What you earn</h2><div class="grid">${Object.entries(COM).map(([d,r])=>`<div class="stat"><span>${d==='Gadgets'?'Gadgets and other':d}</span><b>${r}%</b></div>`).join('')}</div><ul class="ck"><li>30-day tracking window on every link</li><li>Payouts from $50, after a 14-day refund window</li><li>Bank transfer, PayPal or mobile money</li><li>Live dashboard with clicks, sales and earnings</li><li>A marketplace with every product and its customer reviews</li><li>Affiliate of the month recognition</li></ul></div></section><section class="ld"><div class="ldi"><h2>Questions</h2>${FAQ.map(x=>`<details><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('')}<div style="text-align:center;margin-top:24px"><button class="cta" data-top="1">Apply to join</button></div></div></section><footer class="lf"><a href="index.html">Back to the store</a><a href="terms.html">Terms</a><a href="privacy.html">Privacy</a><a href="affiliate-terms.html">Affiliate Agreement</a></footer>`;
const auth=()=>authTop()+landing();
const wait=()=>`<div class="mid"><div class="card"><span class="pill">${U.status==='pending'?'Pending approval':'Not approved'}</span><h2 style="margin-top:10px">${U.status==='pending'?'Application received':'Application not approved'}</h2><p class="sub">${U.status==='pending'?'Thanks, '+esc(U.name)+'. The Tavelya team reviews every affiliate. You can sign in again once you are approved.':'Your application was not approved. Contact the Tavelya team if you think this is a mistake.'}</p><div class="bt" style="display:flex;gap:8px;flex-wrap:wrap">${U.status==='pending'?'<button class="b p" data-chk="1">Check status</button>':''}<button class="b" data-out="1">Sign out</button></div>${DEMO_MODE&&U.status==='pending'?'<p class="sub" style="margin-top:16px">Demo only: <button class="lk" data-apv="1">approve my account</button> (in the live version only the admin can do this)</p>':''}</div></div>`;
const shell=()=>`<div class="top"><div class="in"><img src="${LG}" alt="Tavelya"><span class="tag">Affiliates</span><span class="sp"></span><div class="me"><span><small>Your code</small><b>${U.code}</b></span><button class="av" data-nav="me" aria-label="Profile">${esc(U.name[0]||'Y').toUpperCase()}</button><button class="out" data-out="1">Sign out</button></div></div><div class="tabs">${TABS.map(t=>`<button data-nav="${t[0]}" class="${tab===t[0]?'on':''}">${t[0]==='dash'?'Dashboard':t[0]==='market'?'Marketplace':t[0]==='msg'?'Messages':t[1]}</button>`).join('')}</div></div><main>${V[tab]()}</main><nav class="bnav" aria-label="Main">${TABS.map(t=>`<button data-nav="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</nav><footer>Preview colors: <select id="th"><option value="a">Navy &amp; Orange</option><option value="b">Green &amp; Gold</option><option value="c">White &amp; Orange</option><option value="d">Black &amp; Orange</option></select> (the admin sets the live color)</footer>`;
function draw(){$('#app').innerHTML=!U?auth():U.status==='approved'?shell():wait();const t=$('#th');if(t)t.value=document.documentElement.dataset.t}
const link=id=>new URL('index.html',location.href).href+'?ref='+U.code+'&item='+encodeURIComponent(id);
const mapP=p=>({name:p.name||'',email:p.email||'',status:p.status,code:p.code,rate:Number(p.rate)||0,pay:p.pay||'Bank transfer',det:p.details||''});
async function loadData(){const[sd,rv,ms]=await Promise.all([sb.from('site_data').select('key,value'),sb.from('reviews').select('product,rating,body').eq('status','published'),sb.from('messages').select('body,created_at').order('created_at',{ascending:false})]);const m={};(sd.data||[]).forEach(r=>m[r.key]=r.value);
if(m.depts){COM={};m.depts.forEach(d=>COM[d.name]=(U.rate>0?U.rate:Number(d.rate))||0)}
P=(m.products||[]).map(p=>[p.id,p.title,p.dept,+p.price,[...p.title].reduce((a,c)=>a+c.charCodeAt(0),0)%360,0]);
RV={};(rv.data||[]).forEach(r=>(RV[r.product]=RV[r.product]||[]).push([r.rating||0,r.body||'']));
MSG=(ms.data||[]).map(x=>[x.body,new Date(x.created_at).toLocaleDateString()])}
async function enter(session){const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(!p){U=null;return}
if(p.type!=='affiliate'){await sb.auth.signOut();U=null;err='This account is not an affiliate account. Apply to join first.';mode='up';return}
U=mapP(p);if(U.status==='approved')await loadData()}
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
if(d.nav){tab=d.nav;draw();scrollTo(0,0)}
else if(d.m){mode=d.m;err='';draw()}
else if(d.top){mode='up';err='';draw();scrollTo(0,0)}
else if(d.fp){const em=(document.querySelector('#af [name=email]')||{}).value;if(!em)return toast('Type your email above first.');if(!sb)return;await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split('#')[0]});toast('If that email has an account, a reset link is on its way.')}
else if(d.dp){dp=d.dp;draw()}
else if(d.rv){op=op===d.rv?'':d.rv;draw()}
else if(d.cp){if(navigator.clipboard)navigator.clipboard.writeText(link(d.cp));toast('Link copied')}
else if(d.sh){const p=P.find(x=>x[0]===d.sh);try{await navigator.share({title:p[1],url:link(d.sh)})}catch(x){}}
else if(d.pay)toast('You can request a payout once your available balance reaches $50.')
else if(d.out){if(sb)await sb.auth.signOut();U=null;mode='in';tab='dash';draw()}
else if(d.chk){const{data:{session}}=await sb.auth.getSession();if(session)await enter(session);draw();toast(U&&U.status==='pending'?'Still pending.':'Status updated.')}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,fd=new FormData(f);
if(!sb)return toast('Could not connect. Check your internet connection.');
if(f.id==='af'){const em=String(fd.get('email')).trim().toLowerCase(),pw=String(fd.get('pw'));
if(mode==='in'){const{data,error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error){err='Wrong email or password.';return draw()}err='';await enter(data.session);tab='dash';draw()}
else{const nm=String(fd.get('name')).trim(),{data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{name:nm,type:'affiliate'}}});if(error){err=error.message;return draw()}err='';if(data.session){await enter(data.session)}else{mode='in';toast('Application received. Check your email to confirm your address, then sign in.')}draw()}}
else if(f.id==='pf'){const nm=String(fd.get('name')).trim(),{error}=await sb.rpc('save_profile',{p_name:nm,p_pay:fd.get('pay'),p_details:String(fd.get('det')).trim()});if(error)return toast(error.message);U.name=nm;U.pay=fd.get('pay');U.det=String(fd.get('det')).trim();draw();toast('Profile saved')}});
document.addEventListener('input',e=>{if(e.target.id==='qs'){q=e.target.value;const p=e.target.selectionStart;draw();const i=$('#qs');i.focus();i.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{if(e.target.id==='th')document.documentElement.dataset.t=e.target.value});
async function loadPublic(){try{const{data}=await sb.from('site_data').select('key,value').in('key',['set','depts']);const m={};(data||[]).forEach(r=>m[r.key]=r.value);if(m.set&&m.set.atheme)document.documentElement.dataset.t=m.set.atheme;if(m.depts&&m.depts.length){COM={};m.depts.forEach(d=>COM[d.name]=Number(d.rate)||0)}}catch(e){}}
(async()=>{if(window.supabase&&window.TV_CONFIG){sb=supabase.createClient(TV_CONFIG.url,TV_CONFIG.key);await loadPublic();const{data:{session}}=await sb.auth.getSession();if(session)await enter(session)}draw()})();
</script>
</body>
</html>
